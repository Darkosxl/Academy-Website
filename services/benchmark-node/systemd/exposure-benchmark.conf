# Rootless Podman requires every parent of XDG_RUNTIME_DIR and its graph root
# to be traversable. Execute-only for "other" exposes neither listings nor files.
d /run/exposure-benchmark 0751 root exposure-benchmark -
d /run/exposure-benchmark/executor 2750 exposure-executor exposure-benchmark -
d /run/exposure-benchmark/gateways 2750 exposure-controller exposure-benchmark -
d /run/exposure-benchmark/executor-runtime 0700 exposure-executor exposure-executor -
d /var/lib/exposure-benchmark 0751 root exposure-benchmark -
d /var/lib/exposure-benchmark/cache 0700 exposure-executor exposure-executor -
d /var/lib/exposure-benchmark/executor 0701 exposure-executor exposure-executor -
d /var/lib/exposure-benchmark/runs 0700 exposure-executor exposure-executor -
# Retain failed-run evidence briefly, then bound disk usage without touching benchmark caches.
e /var/lib/exposure-benchmark/runs 0700 exposure-executor exposure-executor 2d
