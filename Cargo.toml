[workspace]
members = [
    "crates/benchmark-protocol",
    "services/academy",
    "services/benchmark-node",
]
default-members = [
    "crates/benchmark-protocol",
    "services/academy",
    "services/benchmark-node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
# store-only ZIP for the admin's "download every consent form" button. No compression
# features: the payload is PDFs and phone photos, which are already compressed.
zip = { version = "2", default-features = false }

[profile.release]
strip = true
